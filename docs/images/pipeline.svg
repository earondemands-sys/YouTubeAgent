<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Pipeline: recorded and faceless videos flow through 15 agents and four approval gates, from input to analytics">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0A0C12"/><stop offset="1" stop-color="#11101A"/></linearGradient>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.2" fill="#FFFFFF" fill-opacity=".05"/></pattern>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#5B6580"/></marker>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .card rect:first-child { fill: #141824; stroke: #283044; }
    .em { font-size: 18px; }
    .nm { fill: #F1F3F8; font-size: 16px; font-weight: 700; }
    .sb { fill: #8790A6; font-size: 12.5px; font-weight: 500; }
    .gate rect { fill: #FFD400; }
    .gate text { fill: #15130A; font-size: 13px; font-weight: 800; }
    .flow { fill: none; stroke: #5B6580; stroke-width: 2; stroke-dasharray: 6 7; animation: flow 1.2s linear infinite; }
    .loop { fill: none; stroke: #A78BFA; stroke-opacity: .7; stroke-width: 2; stroke-dasharray: 3 7; animation: flow 1.8s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    .stage { font-size: 13px; font-weight: 800; letter-spacing: 2.5px; }
    .num { font-size: 13px; font-weight: 800; fill: #4C5570; }
    .lane { font-size: 11px; font-weight: 800; letter-spacing: 3px; }
    .note { fill: #8790A6; font-size: 12.5px; font-weight: 600; }
  </style>
</defs>
<rect width="1280" height="600" rx="22" fill="url(#bg)"/>
<rect width="1280" height="600" rx="22" fill="url(#dots)"/>
<rect x="16" y="92" width="620" height="146" rx="16" fill="#FF2E4D" fill-opacity=".05" stroke="#FF2E4D" stroke-opacity=".18" stroke-dasharray="4 6"/>
