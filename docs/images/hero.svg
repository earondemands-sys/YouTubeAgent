<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="YouTube Agent: a 15-agent Claude Code team that turns a raw recording or a topic into a published YouTube video">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0C12"/>
      <stop offset="1" stop-color="#140E1C"/>
    </linearGradient>
    <radialGradient id="glowRed" cx="0.12" cy="0.2" r="0.55">
      <stop offset="0" stop-color="#FF0033" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF0033" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrange" cx="0.92" cy="0.95" r="0.6">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E4D"/>
      <stop offset="1" stop-color="#FFB547"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF2E4D"/>
      <stop offset="0.5" stop-color="#FFD400"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#FFFFFF" stroke-opacity="0.035"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .pulse { transform-origin: 140px 150px; animation: pulse 2.4s ease-out infinite; }
      .pulse2 { transform-origin: 140px 150px; animation: pulse 2.4s ease-out 1.2s infinite; }
      @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.9); opacity: 0; } }
      .dot { animation: run 7s linear infinite; }
      @keyframes run { 0% { transform: translateX(0); } 100% { transform: translateX(1060px); } }
      .chip rect { fill: #151925; stroke: #2A3042; }
      .chip text { fill: #D7DBE5; font-size: 15px; font-weight: 600; }
      .pill rect { fill: #FFFFFF; fill-opacity: .06; stroke: #FFFFFF; stroke-opacity: .12; }
      .pill .n { fill: #FFFFFF; font-size: 20px; font-weight: 800; }
      .pill .l { fill: #9AA3B8; font-size: 15px; font-weight: 500; }
    </style>
  </defs>

  <rect width="1280" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1280" height="440" rx="22" fill="url(#grid)"/>
  <rect width="1280" height="440" rx="22" fill="url(#glowRed)"/>
  <rect width="1280" height="440" rx="22" fill="url(#glowOrange)"/>

  <!-- play button -->
  <circle class="pulse" cx="140" cy="150" r="80" fill="none" stroke="#FF0033" stroke-width="3"/>
  <circle class="pulse2" cx="140" cy="150" r="80" fill="none" stroke="#FF0033" stroke-width="3"/>
  <rect x="78" y="106" width="124" height="88" rx="26" fill="#FF0033" filter="url(#soft)" opacity=".7"/>
  <rect x="78" y="106" width="124" height="88" rx="26" fill="#FF0033"/>
  <path d="M127 128 L161 150 L127 172 Z" fill="#FFFFFF"/>


  <!-- output mockups: a finished thumbnail and a Short -->
  <g transform="translate(1158 70) rotate(7)">
    <rect width="96" height="170" rx="12" fill="#11141C" stroke="#2A3042"/>
    <rect x="6" y="6" width="84" height="158" rx="8" fill="#1B2030"/>
    <circle cx="48" cy="70" r="20" fill="#E0A070"/>
    <rect x="22" y="90" width="52" height="40" rx="18" fill="#E0A070"/>
    <rect x="14" y="20" width="68" height="20" rx="3" fill="#FFD400"/>
    <text x="48" y="35" font-size="11" font-weight="900" fill="#111" text-anchor="middle">TOP 3</text>
    <text x="48" y="150" font-size="10" font-weight="800" fill="#fff" text-anchor="middle">#shorts</text>
  </g>
  <g transform="translate(985 128) rotate(-4) scale(0.86)">
    <rect x="-8" y="-8" width="276" height="172" rx="16" fill="#000" opacity=".35"/>
    <rect width="260" height="146" rx="12" fill="#0E0F14"/>
    <rect width="260" height="146" rx="12" fill="url(#word)" opacity=".18"/>
    <circle cx="200" cy="66" r="30" fill="#E0A070"/>
    <rect x="166" y="96" width="68" height="50" rx="24" fill="#E0A070"/>
    <text x="16" y="56" font-size="31" font-weight="900" fill="#FFFFFF" stroke="#000" stroke-width="1.5" paint-order="stroke">TICKET</text>
    <text x="16" y="92" font-size="31" font-weight="900" fill="#FFD400" stroke="#000" stroke-width="1.5" paint-order="stroke">STUCK?</text>
    <rect x="206" y="120" width="44" height="18" rx="4" fill="#000" opacity=".8"/>
    <text x="228" y="133" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">12:48</text>
    <rect x="0" y="142" width="170" height="4" fill="#FF0033"/>
  </g>

  <!-- title -->
  <text x="250" y="140" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="-1.5">YouTube <tspan fill="url(#word)">Agent</tspan></text>
  <text x="252" y="186" font-size="24" fill="#AEB5C6" font-weight="500">A 15-agent Claude Code team that takes a raw recording or a topic</text>
  <text x="252" y="218" font-size="24" fill="#AEB5C6" font-weight="500">and ships a finished, published YouTube video.</text>

  <!-- stat pills -->
  <g class="pill" transform="translate(252 244)">
    <rect width="134" height="40" rx="20"/><text class="n" x="18" y="27">15</text><text class="l" x="48" y="26">agents</text>
  </g>
  <g class="pill" transform="translate(398 244)">
    <rect width="134" height="40" rx="20"/><text class="n" x="18" y="27">10</text><text class="l" x="48" y="26">styles</text>
  </g>
  <g class="pill" transform="translate(544 244)">
    <rect width="184" height="40" rx="20"/><text class="n" x="18" y="27">4</text><text class="l" x="38" y="26">approval gates</text>
  </g>
  <g class="pill" transform="translate(740 244)">
    <rect width="156" height="40" rx="20"/><text class="n" x="18" y="27">1</text><text class="l" x="38" y="26">command</text>
  </g>

  <!-- pipeline track -->
  <line x1="110" y1="368" x2="1170" y2="368" stroke="url(#track)" stroke-width="3" stroke-opacity=".55"/>
  <circle class="dot" cx="110" cy="368" r="7" fill="#FFFFFF"/>
  <circle class="dot" cx="110" cy="368" r="16" fill="#FFFFFF" opacity=".15"/>

  <g class="chip" transform="translate(52 348)"><rect width="116" height="40" rx="12"/><text x="18" y="26">🎙️ Edit</text></g>
  <g class="chip" transform="translate(186 348)"><rect width="126" height="40" rx="12"/><text x="18" y="26">🎨 Render</text></g>
  <g class="chip" transform="translate(330 348)"><rect width="148" height="40" rx="12"/><text x="18" y="26">🖼️ Thumbnail</text></g>
  <g class="chip" transform="translate(496 348)"><rect width="124" height="40" rx="12"/><text x="18" y="26">📱 Shorts</text></g>
  <g class="chip" transform="translate(638 348)"><rect width="104" height="40" rx="12"/><text x="18" y="26">🔎 SEO</text></g>
  <g class="chip" transform="translate(760 348)"><rect width="94" height="40" rx="12"/><text x="18" y="26">✅ QA</text></g>
  <g class="chip" transform="translate(872 348)"><rect width="126" height="40" rx="12"/><text x="18" y="26">🚀 Upload</text></g>
  <g class="chip" transform="translate(1016 348)"><rect width="150" height="40" rx="12"/><text x="18" y="26">📈 Analytics</text></g>

  <text x="254" y="64" font-size="14" fill="#8A93A8" font-weight="700" letter-spacing="3">BUILT FOR CLAUDE CODE</text>
</svg>
