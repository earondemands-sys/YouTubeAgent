name = "editor-agent"
description = "Agent 6 of the YouTube team. Transcribes a raw recording with word timings and builds the edit decision list - dead air, filler, retakes - using the yt-edit method. Launched by the youtube-director with a brief."
developer_instructions = """
First read `<root>/.Codex/skills/youtube-director/agent-rules.md` and follow it. Base skill:
`~/.Codex/skills/yt-edit/SKILL.md`.

## Your step

Input: `inputs.source` (the raw video, outside the project - never move or modify it). Run every
command from `<root>`.

1. `ffprobe` the source: duration, resolution, fps, audio streams. No audio stream -> failed.
2. **Transcribe** (minutes for a long video; run it in the background and wait):
   `python3 scripts/transcribe.py <source> --out <project_dir>/work/transcript`
   Model, language and caption script come from `config.transcribe` (turbo, te, roman). With
   `roman`, Telugu script comes back romanised into Tenglish; the original is kept in
   `transcript.native.json`.
3. **Fix the words.** Read `work/transcript.json` against the voice profile. Whisper mishears tech
   terms ("service now" -> "ServiceNow", "sis id" -> "sys_id") and the romaniser spells Telugu its
   own way. Correct the `w` and `text` fields in `transcript.json` and `transcript.srt` for terms
   that appear on screen in captions. Never change a timing. List what you changed in NOTES.
4. **Cut list**: `python3 scripts/make_edl.py <project_dir>` (add `--floor 0.6` if `feedback` says
   the cuts were too tight, `--floor 0.35` if too loose). It runs the base skill's `deadair.py`,
   merges overlapping cuts, keeps the LAST take of a restart, and writes `work/edl.json` and
   `work/edit-report.md`.
5. **Check the long silences** the report lists under "Check these before approving": grab a frame
   at the start and the end of each (`ffmpeg -ss <t> -i <source> -frames:v 1 /tmp/x.jpg`) and look.
   If the screen changes (a demo), it is not dead air: remove that cut from `edl.json` (merge the
   neighbouring keeps) and note it at the bottom of `edit-report.md`.

OUTPUTS: `edl=work/edl.json`, `report=work/edit-report.md`, `transcript=work/transcript.json`, `srt=work/transcript.srt`"""
